name: Build release bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test suite (release gate, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - macos-15-intel
    env:
      NOT_CRAN: "true"
      CI: "true"
      RGL_USE_NULL: "true"
      SHINYTEST2_TIMEOUT: "240000"
      SHINYTEST2_LOAD_TIMEOUT: "240000"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up R
        uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590
        with:
          extra-packages: |
            any::testthat
            any::shinytest2
            any::chromote
          needs: check
          pak-version: stable

      - name: Check test environment
        run: Rscript -e "chrome <- chromote::find_chrome(); cat('Operating system:', Sys.info()[['sysname']], '\n'); cat('Architecture:', Sys.info()[['machine']], '\n'); cat('R version:', R.version.string, '\n'); cat('Chrome executable:', chrome, '\n'); if (!nzchar(chrome)) stop('Chrome/Chromium is required so Shiny browser E2E tests cannot be silently skipped.')"

      - name: Run full testthat suite including shiny e2e
        run: Rscript -e "options(shinytest2.timeout = 240000, shinytest2.load_timeout = 240000, testthat.progress.max_fails = Inf); testthat::test_dir('tests/testthat', reporter = 'summary', stop_on_failure = TRUE, stop_on_warning = FALSE)"

      - name: Build source package for release check
        run: Rscript -e "r <- file.path(R.home('bin'), if (.Platform[['OS.type']] == 'windows') 'R.exe' else 'R'); status <- system2(r, c('CMD', 'build', '.')); quit(status = status)"

      - name: Run R CMD check release gate
        run: Rscript -e "pkg <- list.files(pattern = '^BIOSZEN_.*[.]tar[.]gz$', full.names = TRUE); stopifnot(length(pkg) == 1L); status <- system2(file.path(R.home('bin'), 'R'), c('CMD', 'check', '--no-manual', '--no-build-vignettes', pkg[[1]])); quit(status = status)"

  package:
    name: Package BIOSZEN (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up R
        uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590
        with:
          r-version: 'release'

      - name: Configure CRAN mirror
        run: |
          echo 'options(repos = c(CRAN = "https://cran.rstudio.com"))' >> ~/.Rprofile

      - name: Install dependency helpers
        run: |
          Rscript -e "install.packages(c('desc', 'remotes', 'pak'), repos = 'https://cran.rstudio.com')"

      - name: Read package metadata
        run: |
          PKG_NAME=$(Rscript -e "cat(as.character(desc::desc_get('Package')))")
          PKG_VERSION=$(Rscript -e "cat(as.character(desc::desc_get('Version')))")
          echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV
          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
          echo "PKG_TARBALL=${PKG_NAME}_${PKG_VERSION}.tar.gz" >> $GITHUB_ENV
          echo "PKG_TARBALL_RELEASE=${PKG_NAME}-v${PKG_VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Install system libraries (macOS)
        if: matrix.os == 'macos-15'
        run: |
          brew update
          brew install gmp

      - name: Install R package dependencies (macOS, source)
        if: matrix.os == 'macos-15'
        run: |
          Rscript -e "cat('DESCRIPTION deps:\n'); print(desc::desc_get_deps('.'))"
          Rscript -e "cat('Remotes entries:\n'); print(desc::desc_get_remotes())"
          Rscript -e "options(pkgType='source')"
          Rscript -e "remotes::install_deps(dependencies = TRUE, type = 'source')"
          Rscript -e "if (requireNamespace('pak', quietly = TRUE)) try(pak::lockfile_create('pkg.lock'), silent = TRUE)"

      - name: Build macOS source tarball
        if: matrix.os == 'macos-15'
        run: |
          R CMD build .
          mv "$PKG_TARBALL" "$PKG_TARBALL_RELEASE"
          ls -1 "$PKG_TARBALL_RELEASE"

      - name: Prepare release files
        run: |
          mkdir -p dist/release
          cp "$PKG_TARBALL_RELEASE" dist/release/
          cp inst/launchers/App.R dist/release/App.R
          cp README.md dist/release/README.md

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BIOSZEN-release
          path: dist/release

  release:
    name: Publish Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Read package version
        id: version
        run: |
          VERSION=$(awk -F': ' '/^Version:/{print $2}' DESCRIPTION)
          if [ -z "$VERSION" ]; then
            echo "Version not found in DESCRIPTION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle=BIOSZEN-v${VERSION}-bundle.zip" >> "$GITHUB_OUTPUT"

      - name: Download release artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: BIOSZEN-release
          path: dist/release

      - name: Build release bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bundle_dir="bundle/BIOSZEN-v${VERSION}"
          mkdir -p "$bundle_dir"
          cp "dist/release/BIOSZEN-v${VERSION}.tar.gz" "$bundle_dir/"
          cp "dist/release/App.R" "$bundle_dir/"
          cp "dist/release/README.md" "$bundle_dir/"

          test -f "$bundle_dir/README.md"
          test ! -e "$bundle_dir/Download_R_and_RStudio.html"
          grep -Fq 'https://bioszen.github.io/r-rstudio-download-guide/' "$bundle_dir/README.md"

          (cd bundle && zip -r "../BIOSZEN-v${VERSION}-bundle.zip" "BIOSZEN-v${VERSION}")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BIOSZEN v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            BIOSZEN-v${{ steps.version.outputs.version }}-bundle.zip
            README.md
